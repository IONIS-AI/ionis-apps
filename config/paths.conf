# /etc/ionis-apps/paths.conf — where THIS site keeps its data.
#
# Read by the ionis-apps systemd units through EnvironmentFile. Shipped
# %config(noreplace), so an upgrade never overwrites what an operator set.
#
# WHY THIS FILE EXISTS. The binaries carry no built-in paths. They used to, and
# the defaults were this lab's own directories, compiled into an RPM published on
# COPR — a statement about one machine asserted to every machine that installs it.
#
# The failure mode was not a clean error, which is what made it worth fixing: a
# tool creates the directory it was told to write to and then works perfectly. A
# third-party install would silently populate paths that mean nothing on their
# system, and this lab's own live solar feed spent months in /mnt/ai-stack — a
# dataset reserved for AI-stack operations — for exactly that reason. Nobody
# decided it. A default nobody revisited did.
#
# Unset a value and the tool that needs it fails on its first run, naming the flag
# and the variable. That is deliberate: a loud stop beats a quiet write to the
# wrong place.
#
# The values below are this lab's. Yours will differ; nothing here is required to
# look like this.

# Source archives — raw upstream data. On this host these live on archive-pool,
# which is backed up and supports POSIX ACLs.
IONIS_WSPR_DATA_DIR=/mnt/wspr-data
IONIS_WSPR_LIVE_DIR=/mnt/wspr-data/live
IONIS_WSPR_PARQUET_DIR=/mnt/wspr-data/parquet
IONIS_RBN_DATA_DIR=/mnt/rbn-data
IONIS_PSKR_DATA_DIR=/mnt/pskr-data
IONIS_SOLAR_DATA_DIR=/mnt/solar-data/raw

# Contest Cabrillo logs. NOTE the _v2 suffix: the directory beside it is a stale
# first-generation download that stops at 2016, and pointing a tool at the parent
# silently reads a corpus 40% smaller. See fleet-ops docs/STORAGE-DICTIONARY.md §3.
IONIS_CONTEST_LOGS_DIR=/mnt/contest-logs/_v2

# Run reports. Each tool writes to its own subdirectory of this base. Logs, not
# data, so they go under /var/log rather than on a data pool.
IONIS_REPORT_DIR=/var/log/ionis

# ClickHouse endpoint. The shipped units used to carry this lab's own addresses --
# 192.168.1.90 in some, 10.60.1.1 in others, which is also how two units ended up
# disagreeing about which link to use. One value, one place.
IONIS_CH_HOST=10.60.1.1:9000
